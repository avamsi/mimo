<!doctype html>
<html>
    <head>
        <title>mimo</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <style type="text/tailwindcss">
            .dir > * {
                @apply ml-4;
            }
            iframe {
                @apply h-full w-full;
            }
        </style>
    </head>
    <body class="flex h-screen">
        <aside class="border-r border-slate-200 overflow-auto p-4 w-64">
            <header
                class="border-b border-slate-200 flex [font-variant:small-caps] justify-between mb-2 pb-2"
            >
                Tree
                <button class="[font-variant:inherit]" onclick="newNotebook()">
                    New
                </button>
            </header>
            <div id="tree"></div>
        </aside>
        <main class="flex flex-1 flex-col">
            <nav id="tabbar"></nav>
            <div id="container" class="flex-1"></div>
        </main>
        <script>
            const tree = document.getElementById("tree");
            const container = document.getElementById("container");

            function post(url, body = {}) {
                return fetch(url, {
                    method: "POST",
                    body: JSON.stringify(body),
                })
                    .then((r) => r.json())
                    .catch(alert);
            }

            function buildTree(files) {
                return files
                    .map((f) =>
                        f.isDirectory
                            ? `<div class="dir">${f.name}${buildTree(f.children)}</div>`
                            : `<div class="cursor-pointer file" data-path="${f.path}">${f.name}</div>`,
                    )
                    .join("");
            }

            function refreshTree() {
                return post("/api/home/workspace_files").then(({ files }) => {
                    tree.innerHTML = buildTree(files);
                });
            }

            refreshTree();

            const tabs = new Map();

            function openTab(path) {
                for (const [tabPath, iframe] of tabs) {
                    iframe.hidden = tabPath !== path;
                }
                if (tabs.has(path)) {
                    return;
                }
                const iframe = document.createElement("iframe");
                iframe.src = `/?file=${encodeURIComponent(path)}`;
                container.appendChild(iframe);
                tabs.set(path, iframe);
            }

            function newNotebook() {
                let path = prompt("Notebook relative path:");
                if (!path) {
                    return;
                }
                if (!path.endsWith(".py")) {
                    path += ".py";
                }
                return post("/api/files/create", {
                    path: ".",
                    type: "file",
                    name: path,
                    contents: btoa("import marimo; app = marimo.App()"),
                })
                    .then(() => refreshTree())
                    .then(() => openTab(path));
            }

            tree.addEventListener("click", (e) => {
                const file = e.target.closest(".file");
                if (file) {
                    openTab(file.dataset.path);
                }
            });
        </script>
    </body>
</html>
