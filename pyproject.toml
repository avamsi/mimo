[project]
name = "mimo"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "marimo[mcp,recommended]>=0.20.2",
    "pip-system-certs>=5.3",
    "plotly[express]>=6.5.2",
]

[project.scripts]
mimo = "mimo:main"

[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"
